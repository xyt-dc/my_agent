[project]
name = "my-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3",
    "langchain-deepseek>=1.1.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
my-agent = "my_agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
